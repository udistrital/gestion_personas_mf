<section class="barra-acciones" aria-label="Acciones del registro">
  <div class="estado-autoguardado" aria-live="polite">
    <mat-icon class="estado-autoguardado__icono" aria-hidden="true">cloud_done</mat-icon>
    <div class="estado-autoguardado__texto">
      <strong>{{ estadoMensaje }}</strong>
      <span>{{ estadoDetalle }}</span>
    </div>
  </div>

  <div class="acciones">
    <button
      *ngIf="mostrarRegreso"
      class="boton-borrador"
      type="button"
      (click)="regreso.emit()"
    >
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      <span>{{ tituloRegresar }}</span>
    </button>

    <button
      *ngIf="mostrarDescartar"
      class="boton-borrador boton-borrador--peligro"
      type="button"
      [disabled]="deshabilitarDescartar"
      (click)="descartar.emit()"
    >
      <mat-icon aria-hidden="true">delete_outline</mat-icon>
      <span>{{ tituloDescartar }}</span>
    </button>

    <button
      *ngIf="mostrarGuardar"
      class="boton-borrador"
      type="button"
      [disabled]="deshabilitarGuardar"
      [attr.title]="deshabilitarGuardar ? ayudaGuardar : null"
      (click)="guardar.emit()"
    >
      <mat-icon aria-hidden="true">save</mat-icon>
      <span>{{ tituloGuardar }}</span>
    </button>

    <button
      *ngIf="!esUltimoPaso"
      class="boton-acento"
      type="button"
      [disabled]="deshabilitarContinuar"
      [attr.title]="deshabilitarContinuar ? ayudaContinuar : null"
      (click)="continuar.emit()"
    >
      <span>{{ tituloContinuar }}</span>
      <mat-icon aria-hidden="true">arrow_forward</mat-icon>
    </button>

    <button
      *ngIf="esUltimoPaso"
      class="boton-acento"
      type="button"
      [disabled]="deshabilitarContinuar"
      [attr.title]="deshabilitarContinuar ? ayudaContinuar : null"
      (click)="finalizar.emit()"
    >
      <mat-icon aria-hidden="true">{{ iconoFinal }}</mat-icon>
      <span class="boton-acento__textos">
        <span>{{ tituloFinal }}</span>
        <span *ngIf="subtituloFinal" class="boton-acento__subtitulo">
          {{ subtituloFinal }}
        </span>
      </span>
    </button>
  </div>
</section>
