<section class="barra-acciones" aria-label="Acciones del registro">
  <div class="estado-autoguardado" aria-live="polite">
    <mat-icon class="estado-autoguardado__icono" aria-hidden="true">cloud_done</mat-icon>
    <div class="estado-autoguardado__texto">
      <strong>{{ estadoMensaje }}</strong>
      <span>{{ estadoDetalle }}</span>
    </div>
  </div>

  <div class="acciones">
    <button
      *ngIf="mostrarRegreso"
      class="boton-borrador"
      type="button"
      (click)="regreso.emit()"
    >
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      <span>{{ tituloRegresar }}</span>
    </button>

    <button class="boton-borrador" type="button" (click)="guardar.emit()">
      <mat-icon aria-hidden="true">save</mat-icon>
      <span>Guardar Borrador</span>
    </button>

    <button
      *ngIf="!esUltimoPaso"
      class="boton-acento"
      type="button"
      [disabled]="deshabilitarContinuar"
      [attr.title]="deshabilitarContinuar ? ayudaContinuar : null"
      (click)="continuar.emit()"
    >
      <span>{{ tituloContinuar }}</span>
      <mat-icon aria-hidden="true">arrow_forward</mat-icon>
    </button>

    <button
      *ngIf="esUltimoPaso"
      class="boton-acento"
      type="button"
      [disabled]="deshabilitarContinuar"
      [attr.title]="deshabilitarContinuar ? ayudaContinuar : null"
      (click)="finalizar.emit()"
    >
      <span>Finalizar</span>
      <mat-icon aria-hidden="true">check_circle</mat-icon>
    </button>
  </div>
</section>
