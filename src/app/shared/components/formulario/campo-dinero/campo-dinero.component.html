<mat-form-field appearance="outline" subscriptSizing="dynamic" class="campo-dinero">
  <span matPrefix class="prefijo" aria-hidden="true">$</span>
  <input
    matInput
    [id]="id"
    [attr.aria-label]="ariaLabel || null"
    [disabled]="deshabilitado"
    [value]="valorMostrado"
    inputmode="numeric"
    type="text"
    (blur)="marcarComoTocado()"
    (input)="actualizarValor($event)"
    (keydown)="permitirSoloDigitos($event)"
  />
  <span matSuffix class="sufijo" aria-hidden="true">COP</span>
</mat-form-field>
