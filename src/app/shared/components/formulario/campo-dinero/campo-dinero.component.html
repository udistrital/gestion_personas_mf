<div class="campo-dinero">
  <span class="prefijo" aria-hidden="true">$</span>
  <input
    [id]="id || null"
    [attr.aria-label]="ariaLabel || null"
    [disabled]="deshabilitado"
    [value]="valorMostrado"
    inputmode="numeric"
    type="text"
    (blur)="marcarComoTocado()"
    (input)="actualizarValor($event)"
    (keydown)="permitirSoloDigitos($event)"
  >
  <span class="sufijo">COP</span>
</div>
