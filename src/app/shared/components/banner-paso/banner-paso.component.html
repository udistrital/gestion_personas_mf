<section
  class="banner-paso"
  [class.banner-paso--error]="variante === 'error'"
  [attr.role]="rol"
  [attr.aria-live]="ariaLive"
  [attr.aria-labelledby]="'banner-paso-titulo'"
>
  <div class="banner-paso__icono" aria-hidden="true">
    <mat-icon>{{ icono }}</mat-icon>
  </div>

  <div class="banner-paso__textos">
    <div class="banner-paso__cabecera">
      <h2 id="banner-paso-titulo" class="banner-paso__titulo">
        {{ titulo }}
      </h2>

      @for (etiqueta of etiquetas; track etiqueta) {
        <span class="banner-paso__etiqueta">{{ etiqueta }}</span>
      }
    </div>

    @if (descripcion) {
      <p class="banner-paso__descripcion">{{ descripcion }}</p>
    }

    <!-- Detalle adicional (falla técnica, avisos, etc.). -->
    <ng-content></ng-content>
  </div>

  <div class="banner-paso__acciones">
    <ng-content select="[acciones]"></ng-content>
  </div>
</section>
