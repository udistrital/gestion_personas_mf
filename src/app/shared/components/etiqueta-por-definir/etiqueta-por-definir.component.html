<span class="etiqueta-por-definir" [attr.title]="detalle || null">
  <mat-icon class="etiqueta-por-definir__icono" aria-hidden="true">{{
    icono
  }}</mat-icon>
  <span class="etiqueta-por-definir__texto">{{ texto }}</span>
  @if (detalle) {
    <span class="etiqueta-por-definir__detalle">: {{ detalle }}</span>
  }
</span>
