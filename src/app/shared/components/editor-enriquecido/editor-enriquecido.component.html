<div class="editor">
  <!-- Barra de herramientas -->
  <div class="editor__barra" role="toolbar" aria-label="Formato de texto">
    @for (accion of acciones; track accion.comando) {
      <button
        class="editor__boton"
        type="button"
        [attr.aria-label]="accion.etiqueta"
        [attr.title]="accion.etiqueta"
        [attr.aria-pressed]="activos()[accion.comando] ? 'true' : 'false'"
        [disabled]="deshabilitado"
        (mousedown)="aplicar(accion, $event)"
      >
        @switch (accion.comando) {
          @case ("bold") {
            <strong aria-hidden="true">B</strong>
          }
          @case ("italic") {
            <em aria-hidden="true">I</em>
          }
          @case ("underline") {
            <span class="editor__subrayado" aria-hidden="true">U</span>
          }
          @case ("insertUnorderedList") {
            <mat-icon aria-hidden="true">format_list_bulleted</mat-icon>
          }
          @case ("insertOrderedList") {
            <mat-icon aria-hidden="true">format_list_numbered</mat-icon>
          }
        }
      </button>
    }

    <span class="editor__separador" aria-hidden="true"></span>

    <button
      class="editor__boton"
      type="button"
      aria-label="Limpiar formato"
      title="Limpiar formato"
      [disabled]="deshabilitado"
      (mousedown)="limpiarFormato($event)"
    >
      <mat-icon aria-hidden="true">format_clear</mat-icon>
    </button>
  </div>

  <!-- Área editable -->
  <div
    #area
    class="editor__area"
    role="textbox"
    aria-multiline="true"
    tabindex="0"
    [attr.contenteditable]="deshabilitado ? 'false' : 'true'"
    [attr.data-pista]="pista"
    [attr.aria-labelledby]="idEtiqueta || null"
    [attr.aria-describedby]="descritoPor"
    [attr.aria-disabled]="deshabilitado ? 'true' : null"
    [style.min-height.rem]="rows * 1.5"
    (input)="sincronizar()"
    (keyup)="alTeclaIr()"
    (blur)="alSalir()"
  ></div>
</div>

@if (minCaracteres > 0 || nota) {
  <div class="editor__pie">
    @if (minCaracteres > 0) {
      <span
        [id]="idContador"
        class="editor__contador"
        aria-live="polite"
        [class.editor__contador--excede]="excedeMaximo"
      >
        {{ contador }} caracteres
        <span>· mínimo {{ minCaracteres }}</span>
        @if (maxCaracteres > 0) {
          <span>· máximo {{ maxCaracteres }}</span>
        }
      </span>
    }

    @if (nota) {
      <span [id]="idNota" class="editor__nota">
        <mat-icon aria-hidden="true">info</mat-icon>
        <span>{{ nota }}</span>
      </span>
    }
  </div>
}

@if (ayuda) {
  <span [id]="idAyuda" class="campo__ayuda">{{ ayuda }}</span>
}
